# ==============================================================================
# 鹏城星云 iEarth DataHub · FROM-GLC10 (全球 10 米地表覆盖) 专用农业提取流水线配置
# 数据集引用：Gong P., et al. (2019, 2024), Science Bulletin, 清华大学 / 鹏城实验室
# 算法技术依据：联合国粮农组织与统计司 (FAO/UNSD)《农业统计遥感手册》(第 8、11、24、26 章)
# ==============================================================================

project:
  name: "FROM-GLC10 Agriculture Parcel Extraction & Unbiased Area Pipeline"
  version: "1.0.0"
  description: "基于全球 10 米地表覆盖产品 (FROM-GLC10) 的农作物分类图斑提取、田埂切分与联合国无偏面积估计"

input_source:
  # 运行模式：'geotiff' (读取本地下载的 10 米 FROM-GLC10 瓦片) 或 'synthetic' (内置 10 米基准仿真自测)
  mode: "synthetic"
  # 用户从 https://data-starcloud.pcl.ac.cn/iearthdata/1 下载的 2°×2° 瓦片存放目录
  geotiff_dir: "data/glc10_tifs"

# FROM-GLC10 官方分类体系与农作物图层提取映射表
glc10_classes:
  # 目标农作物类别定义（用户可按需开启提取）：
  target_crop_codes:
    10: "大田农作物 (通用耕地)"        # Level-1 Crop
    11: "水稻田 (Paddy Rice)"          # Level-2 Rice
    12: "设施农业 / 温室大棚 (Greenhouse)" # Level-2 Greenhouse
    13: "旱地其他农作物 (Other Crops)"   # Level-2 Other upland crops
    24: "经济果园 (Orchard)"           # Level-2 Orchard (可选)
    94: "休闲裸耕地 (Bare Cropland)"   # Level-2 季节性翻耕裸田 (可选)

  # 背景/非农田类别（自动作为田埂与背景空间阻断层）：
  background_codes:
    0: "未分类/背景"
    20: "森林大类 (Forest)"
    21: "阔叶林"
    22: "针叶林"
    23: "混交林"
    30: "草地 (Grass)"
    31: "人工草地"
    32: "天然草地"
    40: "灌木丛 (Shrub)"
    50: "湿地 (Wetland)"
    60: "水体 (Water)"
    70: "苔原 (Tundra)"
    80: "建设用地/不透水面 (Impervious)"
    90: "荒漠裸地 (Bareland)"
    100: "冰雪 (Snow/Ice)"
    120: "云/阴影 (Cloud)"

segmentation:
  # 针对 10 米分辨率像元定制的形态学田埂切分参数
  apply_boundary_erosion: true       # 启用形态学窄田埂腐蚀（切断细小桥接与机耕道）
  erosion_structure_type: "cross"    # 形态学核类型: "cross" (4-邻域十字交叉核，轻量切分保护窄带农田) 或 "square" (8-邻域方块核)
  erosion_kernel_size: 3             # 结构元素尺寸
  cut_cross_crop_boundaries: true    # 启用不同作物相邻交界处的零拷贝梯度切片差分
  fill_internal_holes: true          # 闭合地块内部微小车辙与阴影空洞
  min_parcel_area_m2: 200.0          # 最小合法地块面积阈值（200㎡ ≈ 0.3 亩，滤除杂乱碎斑）
  max_parcel_area_m2: 20000000.0     # 单块上限阈值（20,000,000㎡ = 30,000 亩 = 2,000 公顷，容纳超大连片核心灌区）
  max_export_parcels: 800            # 优选导出的核心主力地块数量（保障前端地图与属性表秒开）
  smooth_boundaries: true            # 启用 Chaikin 拐角拓扑平滑（消除 10 米栅格阶梯锯齿）
  chaikin_iterations: 1              # Chaikin 平滑迭代轮数 (1 轮适度平滑且保持轻量)

spatial:
  nominal_resolution_meters: 10.0    # FROM-GLC10 物理标称分辨率 (10.0 米)
  export_crs: "WGS84"                # 导出坐标系：标准 WGS84 (RFC 7946 规范)

unbiased_inference:
  # 遵循联合国手册第 24、26 章及 Olofsson et al. (2014) 标准
  enabled: true
  n_bootstrap: 2000                  # 95% 置信区间重抽样迭代次数
  confidence_level: 0.95
  
  # 清华大学团队在《Science Bulletin》发表的 FROM-GLC10 官方先验精度基准
  # 当用户未提供外部地面抽样样方时，自动调用该公信力先验进行去偏估计
  science_bulletin_priors:
    10: { pa: 0.784, ua: 0.752, name: "大田农作物" }
    11: { pa: 0.825, ua: 0.810, name: "水稻田" }
    12: { pa: 0.760, ua: 0.745, name: "设施温室大棚" }
    13: { pa: 0.771, ua: 0.738, name: "旱地其他农作物" }
    24: { pa: 0.710, ua: 0.695, name: "经济果园" }
    94: { pa: 0.680, ua: 0.650, name: "休闲裸耕地" }

paths:
  data_dir: "data"
  glc10_tifs_dir: "data/glc10_tifs"
  output_dir: "output"
  ground_truth_samples: "data/ground_truth_sample.csv"
